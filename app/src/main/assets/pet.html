<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
#pet {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:64px; height:64px;
    image-rendering:pixelated;
}
</style>
</head>
<body>
<img id="pet" src="idle.gif"/>
<script>
(function() {
    var pet = document.getElementById('pet');
    var state = 'idle';
    var walkTimer = null;
    var idleTimer = null;

    function setState(newState) {
        state = newState;
        switch(state) {
            case 'idle':
                pet.src = 'idle.gif';
                scheduleWalk();
                break;
            case 'walk_left':
                pet.src = 'leftwalk.gif';
                break;
            case 'walk_right':
                pet.src = 'rightwalk.gif';
                break;
            case 'drag':
                pet.src = 'idle.gif';
                clearTimeout(walkTimer);
                clearTimeout(idleTimer);
                break;
        }
    }

    function scheduleWalk() {
        clearTimeout(walkTimer);
        var delay = 3000 + Math.random() * 4000;
        walkTimer = setTimeout(function() {
            if (state !== 'idle') return;
            var dir = Math.random() > 0.5 ? 'walk_right' : 'walk_left';
            setState(dir);
            var walkDuration = 2000 + Math.random() * 2000;
            idleTimer = setTimeout(function() {
                setState('idle');
            }, walkDuration);
        }, delay);
    }

    // Pet Engine API - called from native Kotlin
    window.petEngine = {
        onTap: function() {
            setState('idle');
        },
        onDoubleTap: function() {
            setState('idle');
        },
        onLongPress: function() {
            setState('drag');
        },
        onDragStart: function() {
            setState('drag');
        },
        onDragEnd: function() {
            setState('idle');
        }
    };

    // Start
    setState('idle');
})();
</script>
</body>
</html>
