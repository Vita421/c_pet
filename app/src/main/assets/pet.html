<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
#pet {
    position:absolute;
    bottom:0; left:50%;
    transform:translateX(-50%);
    width:64px; height:64px;
    image-rendering:pixelated;
}
</style>
</head>
<body>
<img id="pet" src="idle.gif"/>
<script>
(function() {
    var pet = document.getElementById('pet');
    var state = 'idle';

    function resetPosition() {
        pet.style.bottom = '0';
        pet.style.top = 'auto';
        pet.style.left = '50%';
        pet.style.right = 'auto';
        pet.style.transform = 'translateX(-50%)';
    }

    function setState(newState) {
        state = newState;
        switch(state) {
            case 'idle':
                pet.src = 'idle.gif';
                resetPosition();
                break;
            case 'walk_left':
                pet.src = 'leftwalk.gif';
                resetPosition();
                break;
            case 'walk_right':
                pet.src = 'rightwalk.gif';
                resetPosition();
                break;
            case 'drag':
                pet.src = 'la.gif';
                resetPosition();
                break;
            case 'peek_left':
                pet.src = 'lt.gif';
                pet.style.bottom = '0';
                pet.style.top = 'auto';
                pet.style.left = '0';
                pet.style.right = 'auto';
                pet.style.transform = 'none';
                break;
            case 'peek_right':
                pet.src = 'rt.gif';
                pet.style.bottom = '0';
                pet.style.top = 'auto';
                pet.style.left = 'auto';
                pet.style.right = '0';
                pet.style.transform = 'none';
                break;
        }
    }

    window.petEngine = {
        setState: function(s) {
            setState(s);
        },
        onTap: function() {
            setState('idle');
        },
        onDoubleTap: function() {
            setState('idle');
        },
        onLongPress: function() {
            setState('drag');
        },
        onDragStart: function() {
            setState('drag');
        },
        onDragEnd: function() {
            setState('idle');
        }
    };

    setState('idle');
})();
</script>
</body>
</html>
